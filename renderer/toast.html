<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<style>
  :root{--accent:#2464e8}
  *{box-sizing:border-box}
  body{margin:0;background:transparent;font:13px/1.4 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  .card{display:flex;align-items:center;gap:12px;margin:6px;padding:12px 14px;border-radius:14px;
    background:#fff;border:1px solid #d8e0ee;box-shadow:0 16px 36px #233f7026;cursor:pointer;
    animation:slide .22s cubic-bezier(.2,.7,.3,1) both}
  @keyframes slide{from{opacity:0;transform:translateX(42px)}to{opacity:1;transform:none}}
  .icon{width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .icon svg{width:19px;height:19px}
  .t{flex:1;color:#16233a;font-size:14px;font-weight:600}
  .x{color:#8595aa;font-size:16px;padding:4px 6px}
</style>
<div class="card" id="card">
  <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10m0 0l-4-4m4 4l4-4M5 17h14"/></svg></div>
  <div class="t">检测到链接，点此打开</div>
  <div class="x" id="x">✕</div>
</div>
<script>
  const url = new URLSearchParams(location.search).get('url') || '';
  document.getElementById('card').addEventListener('click', (e) => {
    if (e.target.id === 'x') { window.close(); return; }
    window.api.toastOpen(url);
  });
</script>
</html>
