<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>LoDown</title>
<style>
  :root{
    --bg:#f2f4f7; --panel:#fff; --line:#dbe3f0; --ink:#16233a; --sub:#6b7d95;
    --accent:#2464e8; --accent-soft:#e8efff; --ok:#1a9c5b; --bad:#c0392b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font:14px/1.5 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  .app{display:flex;height:100vh}

  .rail{width:60px;flex:0 0 60px;background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
  .rail button{width:50px;height:52px;border:none;background:none;border-radius:10px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sub);font-size:10px}
  .rail button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .rail button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .rail button:hover{background:#f0f4fb}
  .rail .spacer{flex:1}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}

  .toolbar{display:flex;gap:6px;align-items:center;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line)}
  .toolbar button.nav{width:30px;height:30px;padding:0;background:none;color:var(--sub);border-radius:8px;font-size:15px}
  .toolbar button.nav:hover{background:#eef3fb;color:var(--ink)}
  .toolbar input{flex:1;min-width:0;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:#f7f9fc;font-size:13px;outline:none;-webkit-user-select:text;user-select:text}
  .toolbar input:focus{background:#fff;border-color:var(--accent)}
  .toolbar .dl{padding:6px 14px;border-radius:8px;font-size:12.5px}
  .toolbar .dl:disabled{background:#e9eef7;color:#9aa8bd}

  .workspace{flex:1;min-height:0;display:flex}
  .workspace[hidden]{display:none}
  .browse{flex:1;min-width:0;position:relative;display:flex}
  webview{flex:1;border:0;background:#fff}
  .startpage{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center}
  .startpage .inner{text-align:center}
  .startpage h1{font-size:30px;margin:0 0 8px;letter-spacing:.5px}
  .startpage p{color:var(--sub);font-size:13px;margin:0}

  .side{width:308px;flex:0 0 308px;border-left:1px solid var(--line);overflow:auto;padding:13px;background:#fff}
  .side[hidden]{display:none}

  .page{flex:1;min-height:0;overflow:auto;padding:14px 16px;background:var(--bg)}
  .page[hidden]{display:none}

  .segs{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .seg{padding:7px 13px;border-radius:9px;background:#fff;border:1px solid var(--line);font-size:13px;cursor:pointer;color:var(--sub)}
  .seg.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .seg .n{margin-left:6px;opacity:.85}
  .segs .right{margin-left:auto;display:flex;gap:8px;align-items:center}

  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .item{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid #eef2f8}
  .item:first-child{border-top:none}
  .item .nm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .sub2{color:var(--sub);font-size:11.5px}
  .item .pbar{width:110px;height:5px;background:#e8eef8;border-radius:99px;overflow:hidden;flex:0 0 auto}
  .item .pbar i{display:block;height:100%;background:var(--accent)}
  .item .pc{width:44px;text-align:right;font-size:11.5px;color:var(--sub);flex:0 0 auto}
  .thumb-sm{width:52px;height:30px;border-radius:6px;object-fit:cover;background:#eef2f8;flex:0 0 auto}
  .lnk{color:var(--accent);font-size:12px;cursor:pointer;flex:0 0 auto}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:56px 0}
  .empty svg{width:38px;height:38px;stroke:#c3cede;fill:none;stroke-width:1.5;margin-bottom:10px}

  .sec{border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:9px}
  .sec h4{margin:0 0 8px;font-size:11.5px;color:var(--sub);font-weight:600;display:flex;justify-content:space-between;gap:8px}
  .sec h4 span{font-weight:400;white-space:nowrap;opacity:.9}
  .opts{display:flex;flex-wrap:wrap;gap:6px}
  .opt{border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:#fff;cursor:pointer;font-size:12px}
  .opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
  label.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px}
  .picks{display:flex;gap:9px;flex-wrap:wrap}
  .pick{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
  .pick .frame{border:2px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  .pick img{display:block;width:96px;height:54px;object-fit:cover;background:#eef2f8}
  .pick.on .frame{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .pick .cap{font-size:10.5px;color:var(--sub)}
  .pick.on .cap{color:var(--accent);font-weight:600}
  .pick.round .frame{border-radius:50%}
  .pick.round img{width:58px;height:58px;border-radius:50%}

  button{border:none;border-radius:9px;padding:9px 15px;font-size:13px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  button.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:500}
  .h1{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .h1 .sub{font-weight:400;font-size:11.5px;color:var(--sub)}
  .kv{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #eef2f8}
  .kv:first-child{border-top:none}
  .kv .k{width:80px;color:var(--sub);font-size:12.5px;flex:0 0 auto}
  .kv .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .err{color:var(--bad);font-size:12.5px;margin-top:8px}
  .side .sideHead{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;font-weight:600}
  .side .sideHead .n{color:var(--sub);font-weight:400;font-size:11.5px}
  .side .sideHead .x{margin-left:auto;cursor:pointer;color:#9aa8bd;font-size:15px;line-height:1;padding:2px 4px;border-radius:6px}
  .side .sideHead .x:hover{background:#eef3fb;color:var(--ink)}
</style>

<div class="app">
  <div class="rail">
    <button id="nav-browse" class="on">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8h18"/></svg>
      浏览
    </button>
    <button id="nav-downloads">
      <svg viewBox="0 0 24 24"><path d="M12 3v10m0 0l-4-4m4 4l4-4M5 17h14"/></svg>
      下载
    </button>
    <button id="nav-history">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
      历史
    </button>
    <div class="spacer"></div>
    <button id="nav-settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      设置
    </button>
  </div>

  <div class="main">
    <div class="toolbar" id="toolbar">
      <button class="nav" id="back" title="后退">←</button>
      <button class="nav" id="forward" title="前进">→</button>
      <button class="nav" id="reload" title="刷新">⟳</button>
      <button class="nav" id="home" title="起始页">⌂</button>
      <input id="addr" type="text" placeholder="输入网址或搜索…" spellcheck="false">
      <button class="nav" id="paneltoggle" title="视频资源面板">▤</button>
      <button class="dl" id="download" disabled>下载此页</button>
    </div>

    <div class="workspace" id="workspace">
      <div class="browse" id="browseArea">
        <webview id="view" src="about:blank"></webview>
        <div class="startpage" id="startpage">
          <div class="inner">
            <h1>LoDown</h1>
            <p>上方输入网址开始浏览；支持的站点右上角会出现「下载此页」</p>
          </div>
        </div>
      </div>
      <div class="side" id="side" hidden></div>
    </div>

    <div class="page" id="page" hidden></div>
  </div>
</div>
<script src="app.js"></script>
</html>
