<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>LoDown</title>
<style>
  :root{
    --bg:#f2f4f7; --panel:#fff; --line:#dbe3f0; --ink:#16233a; --sub:#6b7d95;
    --accent:#2464e8; --accent-soft:#e8efff; --ok:#1a9c5b; --bad:#c0392b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font:14px/1.5 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  .app{display:flex;height:100vh}

  .rail{width:60px;flex:0 0 60px;background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
  .rail button{width:50px;height:52px;border:none;background:none;border-radius:10px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sub);font-size:10px}
  .rail button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .rail button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .rail button:hover{background:#f0f4fb}
  .rail .spacer{flex:1}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}

  .tabs{display:flex;align-items:flex-end;gap:4px;padding:6px 8px 0;background:#eef2f8;overflow-x:auto;flex:0 0 auto}
  .tabs .tab{align-self:flex-end}
  .tabs .tab{display:flex;align-items:center;gap:6px;max-width:230px;height:34px;padding:0 10px;border-radius:9px 9px 0 0;
    background:#e2e8f2;color:var(--sub);font-size:12.5px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
  .tabs .tab svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .tabs .tab.on{background:#fff;color:var(--ink);font-weight:600}
  .tabs .tab .t{overflow:hidden;text-overflow:ellipsis;max-width:160px}
  .tabs .tab .x{width:20px;height:20px;line-height:19px;text-align:center;border-radius:50%;color:#7c8ba0;font-size:16px;flex:0 0 auto}
  .tabs .tab .x:hover{background:#cdd8e8;color:#3b4a60}
  .tabs .add{display:flex;align-items:center;justify-content:center;width:30px;height:30px;margin-bottom:2px;background:none;border:none;color:var(--sub);font-size:19px;line-height:1;padding:0;cursor:pointer;border-radius:8px;align-self:center}
  .tabs .add:hover{background:#e2e8f2;color:var(--ink)}
  .views{position:absolute;inset:0}
  .views webview{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;visibility:hidden}
  .views webview.on{visibility:visible}
  .toolbar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line)}
  .navgroup{display:flex;flex:0 0 auto;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
  .navgroup button.nav{width:32px;height:30px;border-radius:0;border-left:1px solid var(--line)}
  .navgroup button.nav:first-child{border-left:none}
  .toolbar button.nav{display:flex;align-items:center;justify-content:center;padding:0;background:#fff;color:#54657e;cursor:pointer}
  .toolbar button.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .toolbar button.nav:hover{background:#eef3fb;color:var(--ink)}
  .toolbar button.nav.solo{width:32px;height:30px;border:1px solid var(--line);border-radius:9px}
  .toolbar button.nav.solo.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .toolbar input{flex:1;min-width:0;height:32px;padding:0 14px;border:1px solid var(--line);border-radius:99px;background:#f7f9fc;font-size:13px;outline:none;-webkit-user-select:text;user-select:text}
  .toolbar input:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .toolbar .dl{display:flex;align-items:center;height:32px;padding:0 14px;border-radius:9px;font-size:12.5px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-weight:600}
  .toolbar .dl svg{stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:15px;height:15px}
  .toolbar .dl:disabled{background:#e9eef7;color:#9aa8bd}
  .toolbar .dl:disabled svg{stroke:#9aa8bd}

  .workspace{flex:1;min-height:0;display:flex}
  .workspace[hidden]{display:none}
  .browse{flex:1;min-width:0;position:relative;display:flex}
  .tabs[hidden]{display:none}
  webview{flex:1;border:0;background:#fff}
  .startpage{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center}
  .startpage .inner{text-align:center}
  .startpage h1{font-size:30px;margin:0 0 8px;letter-spacing:.5px}
  .startpage p{color:var(--sub);font-size:13px;margin:0}

  .side{width:308px;flex:0 0 308px;border-left:1px solid var(--line);overflow:auto;padding:12px;background:#fff;display:flex;flex-direction:column}
  .side[hidden]{display:none}

  .page{flex:1;min-height:0;overflow:auto;padding:14px 16px;background:var(--bg)}
  .page[hidden]{display:none}

  .segs{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .seg{padding:7px 13px;border-radius:9px;background:#fff;border:1px solid var(--line);font-size:13px;cursor:pointer;color:var(--sub)}
  .seg.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .seg .n{margin-left:6px;opacity:.85}
  .segs .right{margin-left:auto;display:flex;gap:8px;align-items:center}

  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .item{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid #eef2f8}
  .item:first-child{border-top:none}
  .item .nm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .sub2{color:var(--sub);font-size:11.5px}
  .item .pbar{width:110px;height:5px;background:#e8eef8;border-radius:99px;overflow:hidden;flex:0 0 auto}
  .item .pbar i{display:block;height:100%;background:var(--accent)}
  .item .pc{width:44px;text-align:right;font-size:11.5px;color:var(--sub);flex:0 0 auto}
  .thumb-sm{width:52px;height:30px;border-radius:6px;object-fit:cover;background:#eef2f8;flex:0 0 auto}
  .lnk{color:var(--accent);font-size:12px;cursor:pointer;flex:0 0 auto}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:56px 0}
  .empty svg{width:38px;height:38px;stroke:#c3cede;fill:none;stroke-width:1.5;margin-bottom:10px}

  .sec{border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:9px}
  .sec h4{margin:0 0 8px;font-size:11.5px;color:var(--sub);font-weight:600;display:flex;justify-content:space-between;gap:8px}
  .sec h4 span{font-weight:400;white-space:nowrap;opacity:.9}
  .opts{display:flex;flex-wrap:wrap;gap:6px}
  .opt{border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:#fff;cursor:pointer;font-size:12px}
  .opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
  label.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px}
  .picks{display:flex;gap:9px;flex-wrap:wrap}
  .pick{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
  .pick .frame{border:2px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  .pick img{display:block;width:112px;height:64px;object-fit:cover;background:#eef2f8}
  .pick.on .frame{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .pick .cap{font-size:10.5px;color:var(--sub)}
  .pick.on .cap{color:var(--accent);font-weight:600}
  .pick.round .frame{border-radius:50%}
  .pick.round img{width:64px;height:64px;border-radius:50%}


  button{border:none;border-radius:9px;padding:9px 15px;font-size:13px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  button.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:500}
  .h1{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .h1 .sub{font-weight:400;font-size:11.5px;color:var(--sub)}
  .kv{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #eef2f8}
  .kv:first-child{border-top:none}
  .kv .k{width:80px;color:var(--sub);font-size:12.5px;flex:0 0 auto}
  .kv .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .err{color:var(--bad);font-size:12.5px;margin-top:8px}
  .side .sideHead{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;font-weight:600}
  .side .sideHead .n{color:var(--sub);font-weight:400;font-size:11.5px}
  .side .sideHead .x{margin-left:auto;cursor:pointer;color:#9aa8bd;font-size:15px;line-height:1;padding:2px 4px;border-radius:6px}
  .side .sideHead .x:hover{background:#eef3fb;color:var(--ink)}
  /* 内置登录弹层 */
  #loginModal{position:fixed;inset:0;background:#0b1220aa;display:flex;align-items:center;justify-content:center;z-index:60}
  #loginModal[hidden]{display:none}
  .lm{width:min(980px,92vw);height:min(760px,88vh);background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px #0004}
  .lm .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .lm .bar b{font-size:14px}
  .lm .bar .sp{flex:1}
  .lm .bar .hint{color:var(--sub);font-size:12px}
  .lm webview{flex:1;border:0;background:#fff}
  /* 下载按钮 + 分辨率下拉 */
  .dlbar{display:flex;gap:6px;margin-bottom:10px}
  .dlbar .main{flex:1;height:38px;display:flex;flex-direction:row;flex-wrap:nowrap;white-space:nowrap;align-items:center;justify-content:center;gap:7px;padding:0 10px;line-height:1;font-size:13.5px;text-align:center}
  .dlbar .main svg{width:16px;height:16px;flex:0 0 auto;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .dlbar .caret{width:46px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--accent);border-radius:9px;cursor:pointer;border:none;padding:0}
  .dlbar .caret svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
  .dlbar .caret.open svg{transform:rotate(180deg)}
  .menu{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
  .mrow{display:flex;align-items:center;gap:8px;padding:9px 11px;font-size:12.5px;cursor:pointer;border-top:1px solid #eef2f8}
  .mrow:first-child{border-top:none}
  .mrow:hover{background:#f3f7fd}
  .mrow.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .mrow .q{flex:1}
  .mrow .sz{color:var(--sub);font-size:11.5px}
  .mrow.on .sz{color:var(--accent)}
  .mrow .tick{width:14px;text-align:center;color:var(--accent)}
  /* 媒体资源卡片 */
  .mcard{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fff}
  .mcard h4{margin:0 0 9px;font-size:11.5px;color:var(--sub);font-weight:600;display:flex;justify-content:space-between;gap:8px}
  .mcard h4 span{font-weight:400;white-space:nowrap;opacity:.9}
  .mhead{display:flex;gap:9px;margin-bottom:9px;align-items:stretch}
  .mhead img{width:96px;height:auto;min-height:54px;object-fit:cover;border-radius:7px;background:#eef2f8;flex:0 0 auto;align-self:stretch}
  .mhead .info{min-width:0;flex:1}
  .mhead .tt{font-size:12.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mhead .ss{font-size:11px;color:var(--sub);margin-top:4px}
  .mcard .menu{border:none;border-top:1px solid var(--line);border-radius:0;margin:8px -10px -10px;background:#fbfcfe}
  /* 侧栏底部固定操作区 */
  .sideFoot{position:sticky;bottom:-12px;margin:auto -12px -12px;padding:10px 12px;background:#fff;border-top:1px solid var(--line)}
  .sideFoot button{width:100%;height:36px}
  /* 时间筛选 */
  .tfilter{position:relative}
  .tfilter .tb{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13px;color:var(--ink);cursor:pointer}
  .tfilter .tb svg{width:14px;height:14px;stroke:var(--sub);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
  .tfilter .tb.open svg{transform:rotate(180deg)}
  .tfilter .tm{position:absolute;right:0;top:calc(100% + 6px);min-width:150px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px #1c3b6420;padding:4px;z-index:20}
  .tfilter .tm[hidden]{display:none}
  .tfilter .ti{padding:8px 10px;border-radius:7px;font-size:13px;color:var(--ink);cursor:pointer}
  .tfilter .ti:hover{background:#f2f6fd}
  .tfilter .ti.on{color:var(--accent);font-weight:600;background:var(--accent-soft)}
  /* 历史记录：无外框，按日期分组 */
  .hgroup{margin-bottom:14px;padding-bottom:6px}\n  .hgroup + .hgroup{border-top:1px solid var(--line);padding-top:12px}
  .hdate{font-size:11.5px;color:var(--sub);font-weight:600;padding:2px 0 6px;position:sticky;top:-14px;background:var(--bg);z-index:2}
  .hrow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:8px;cursor:pointer}
  .hrow:hover{background:#fff}
  .hrow .nm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hrow .u{color:var(--sub);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34%;text-align:right;flex:0 1 auto}
  .hrow .tm2{color:var(--sub);font-size:11.5px;width:52px;text-align:right;flex:0 0 auto}
  .hrow .del{color:#9aa8bd;font-size:15px;opacity:0;padding:0 4px;flex:0 0 auto}
  .hrow:hover .del{opacity:1}
</style>

<div class="app">
  <div class="rail">
    <button id="nav-browse" class="on">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8h18"/></svg>
      浏览
    </button>
    <button id="nav-downloads">
      <svg viewBox="0 0 24 24"><path d="M12 3v10m0 0l-4-4m4 4l4-4M5 17h14"/></svg>
      下载
    </button>
    <button id="nav-history">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
      历史
    </button>
    <div class="spacer"></div>
    <button id="nav-settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      设置
    </button>
  </div>

  <div class="main">
    <div class="tabs" id="tabs"></div>
    <div class="toolbar" id="toolbar">
      <div class="navgroup">
        <button class="nav" id="back" title="后退">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="nav" id="forward" title="前进">
          <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="nav" id="reload" title="刷新">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 4v7h-7"/></svg>
        </button>
      </div>
      <input id="addr" type="text" placeholder="输入网址或搜索…" spellcheck="false">
      <button class="nav solo" id="paneltoggle" title="媒体资源面板">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
      </button>
    </div>

    <div class="workspace" id="workspace">
    <div class="browse" id="browseArea">
        <div class="views" id="views"></div>
        <div class="startpage" id="startpage">
          <div class="inner">
            <h1>LoDown</h1>
            <p>上方输入网址开始浏览；支持的站点右上角会出现「下载此页」</p>
          </div>
        </div>
      </div>
      <div class="side" id="side" hidden></div>
    </div>

    <div class="page" id="page" hidden></div>

    <div id="loginModal" hidden>
      <div class="lm">
        <div class="bar">
          <b id="lmTitle">登录</b>
          <span class="hint" id="lmHint">在下方窗口完成登录，然后点「完成登录」</span>
          <span class="sp"></span>
          <button class="ghost" id="lmCancel">取消</button>
          <button id="lmDone">完成登录</button>
        </div>
        <webview id="lmView" partition="persist:login-pending" src="about:blank"></webview>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</html>
